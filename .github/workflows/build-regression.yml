name: build-and-regression

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI container with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/ci/minigw-dockerfile
          tags: minigw-ci:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run local regression tests
        run: |
          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            -e GW_TEST_MPI_RANKS=2 \
            minigw-ci:latest \
            bash scripts/regression_tests_local.sh

      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression_tests_log
          path: regression_tests.log
